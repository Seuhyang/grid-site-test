name: Generate image manifest

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "!images/manifest.json"   # manifest.json 자체 변경은 트리거에서 제외 (무한 루프 방지)
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃 (전체 히스토리 필요 - 파일별 최초 커밋 시각을 읽기 위해)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 그룹핑 + 날짜 계산 + manifest.json 생성
        run: |
          python3 <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path
          from datetime import datetime, timezone

          IMAGES_DIR = Path("images")
          IMAGE_EXT_RE = re.compile(r"\.(jpe?g|png|webp|gif)$", re.IGNORECASE)
          # 카카오톡 같은 배치 저장 패턴: 이름_01.jpg, 이름_02.jpg ...
          BATCH_SUFFIX_RE = re.compile(r"^(.*?)(?:_\d{2})?$")

          def first_commit_date(path: str) -> str:
              """해당 파일이 저장소에 처음 추가된 커밋 시각(ISO 8601)을 반환. 못 찾으면 지금 시각."""
              try:
                  out = subprocess.run(
                      ["git", "log", "--follow", "--diff-filter=A",
                       "--format=%aI", "--", path],
                      capture_output=True, text=True, check=True
                  ).stdout.strip()
                  if out:
                      return out.strip().split("\n")[-1]
              except Exception:
                  pass
              return datetime.now(timezone.utc).isoformat()

          files = sorted(
              p.name for p in IMAGES_DIR.iterdir()
              if p.is_file() and IMAGE_EXT_RE.search(p.name)
          )

          groups = {}
          for name in files:
              stem = Path(name).stem
              base = BATCH_SUFFIX_RE.match(stem).group(1)
              date = first_commit_date(f"images/{name}")
              groups.setdefault(base, []).append({"file": name, "date": date})

          result = []
          for base, photos in groups.items():
              photos.sort(key=lambda p: p["file"])
              group_date = min(p["date"] for p in photos)

              title_file = IMAGES_DIR / f"{base}.title.txt"
              if title_file.exists():
                  title = title_file.read_text(encoding="utf-8").strip().splitlines()[0]
              else:
                  title = datetime.fromisoformat(group_date).strftime("%Y.%m.%d")

              cover_file = IMAGES_DIR / f"{base}.cover.txt"
              cover = photos[0]["file"]
              if cover_file.exists():
                  wanted = cover_file.read_text(encoding="utf-8").strip().splitlines()[0]
                  if any(p["file"] == wanted for p in photos):
                      cover = wanted

              result.append({
                  "slug": base,
                  "title": title,
                  "date": group_date,
                  "cover": cover,
                  "photos": [p["file"] for p in photos],
              })

          with open(IMAGES_DIR / "manifest.json", "w", encoding="utf-8") as f:
              json.dump({"groups": result}, f, ensure_ascii=False, indent=2)

          print(f"{len(result)}개 그룹, 사진 {len(files)}장으로 manifest.json 생성 완료")

          # ---- 그룹별 실제 페이지(group/<slug>/index.html) 생성 ----
          # 쿼리스트링(?g=) 없이 group/<slug>/ 주소로 바로 접속되게 하기 위해,
          # 템플릿 하나를 그룹 수만큼 실제 파일로 복사해둡니다.
          import shutil
          template = Path("templates/group-template.html")
          group_root = Path("group")
          group_root.mkdir(exist_ok=True)

          current_slugs = {g["slug"] for g in result}
          existing_dirs = {p.name for p in group_root.iterdir() if p.is_dir()}

          if template.exists():
              for slug in current_slugs:
                  dest_dir = group_root / slug
                  dest_dir.mkdir(exist_ok=True)
                  shutil.copyfile(template, dest_dir / "index.html")

          # 더 이상 존재하지 않는 그룹의 폴더는 정리
          for stale in existing_dirs - current_slugs:
              shutil.rmtree(group_root / stale)

          print(f"group/ 아래 {len(current_slugs)}개 그룹 폴더 생성/정리 완료")
          PY

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/manifest.json
          git add -A -- group
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "chore: update image manifest [skip ci]"
            git push
          fi
