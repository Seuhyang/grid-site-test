name: Generate image manifest

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "!images/manifest.json"   # manifest.json 자체 변경은 트리거에서 제외 (무한 루프 방지)
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃 (전체 히스토리 필요 - 파일별 최초 커밋 시각을 읽기 위해)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 그룹핑 + 날짜 계산 + manifest.json 생성
        run: |
          python3 <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path
          from datetime import datetime, timezone

          IMAGES_DIR = Path("images")
          IMAGE_EXT_RE = re.compile(r"\.(jpe?g|png|webp|gif)$", re.IGNORECASE)
          # 카카오톡 같은 배치 저장 패턴: 이름_01.jpg, 이름_02.jpg ...
          BATCH_SUFFIX_RE = re.compile(r"^(.*?)(?:_\d{2})?$")

          def slugify(text: str) -> str:
              """파일명을 주소(URL)에 안전한 형태로 변환합니다.
              - 공백 -> 하이픈, 영문 대문자 -> 소문자, 한글은 그대로 유지
              - 관리자 페이지가 아니라 GitHub에 직접 파일을 올렸을 때(파일명에
                공백/대문자가 섞여도) 주소가 항상 안전하게 나오도록 하는 안전장치"""
              text = re.sub(r"\s+", "-", text.strip())
              text = re.sub(r"[^\w\-]", "", text)
              text = text.lower()
              text = re.sub(r"-+", "-", text).strip("-_")
              return text or "group"

          def first_commit_date(path: str) -> str:
              """해당 파일이 저장소에 처음 추가된 커밋 시각(ISO 8601)을 반환. 못 찾으면 지금 시각."""
              try:
                  out = subprocess.run(
                      ["git", "log", "--follow", "--diff-filter=A",
                       "--format=%aI", "--", path],
                      capture_output=True, text=True, check=True
                  ).stdout.strip()
                  if out:
                      return out.strip().split("\n")[-1]
              except Exception:
                  pass
              return datetime.now(timezone.utc).isoformat()

          files = sorted(
              p.name for p in IMAGES_DIR.iterdir()
              if p.is_file() and IMAGE_EXT_RE.search(p.name)
          )

          groups = {}
          for name in files:
              stem = Path(name).stem
              base = BATCH_SUFFIX_RE.match(stem).group(1)
              date = first_commit_date(f"images/{name}")
              groups.setdefault(base, []).append({"file": name, "date": date})

          result = []
          used_slugs = set()
          for base, photos in groups.items():
              photos.sort(key=lambda p: p["file"])
              group_date = min(p["date"] for p in photos)

              # base(원본 파일명)는 계속 사이드카 파일(.title.txt 등) 찾는 열쇠로 쓰고,
              # 실제 주소(slug)는 공백/대문자 등을 정리한 안전한 값을 씁니다.
              slug_candidate = slugify(base)
              slug = slug_candidate
              n = 2
              while slug in used_slugs:
                  slug = f"{slug_candidate}-{n}"
                  n += 1
              used_slugs.add(slug)

              title_file = IMAGES_DIR / f"{base}.title.txt"
              if title_file.exists():
                  title = title_file.read_text(encoding="utf-8").strip().splitlines()[0]
              else:
                  title = datetime.fromisoformat(group_date).strftime("%Y.%m.%d")

              cover_file = IMAGES_DIR / f"{base}.cover.txt"
              cover = photos[0]["file"]
              if cover_file.exists():
                  wanted = cover_file.read_text(encoding="utf-8").strip().splitlines()[0]
                  if any(p["file"] == wanted for p in photos):
                      cover = wanted

              desc_file = IMAGES_DIR / f"{base}.desc.txt"
              content_file = IMAGES_DIR / f"{base}.content.txt"
              photo_files = [p["file"] for p in photos]

              # blocks: 화면에 위에서 아래로 그려질 순서 그대로의 글/사진 목록
              blocks = []

              if content_file.exists():
                  # <base>.content.txt 안에서 {{파일명}} 으로 사진 위치를 직접 지정
                  text_buffer = []
                  referenced = set()

                  def flush_text():
                      if text_buffer:
                          text = "\n".join(text_buffer).strip("\n")
                          if text.strip():
                              blocks.append({"type": "text", "text": text})
                          text_buffer.clear()

                  photo_tag_re = re.compile(r"^\{\{(.+?)\}\}$")
                  for line in content_file.read_text(encoding="utf-8").splitlines():
                      stripped = line.strip()
                      m = photo_tag_re.match(stripped)
                      if m and m.group(1) in photo_files:
                          flush_text()
                          blocks.append({"type": "image", "file": m.group(1)})
                          referenced.add(m.group(1))
                      elif stripped == "":
                          flush_text()
                      else:
                          text_buffer.append(line)
                  flush_text()

                  # 본문에서 언급 안 된 사진은 맨 뒤에 자동으로 붙여서 안 사라지게 함
                  for file in photo_files:
                      if file not in referenced:
                          blocks.append({"type": "image", "file": file})

              elif desc_file.exists():
                  # 예전 방식(설명 글 한 덩어리 + 사진 전부 아래) 그대로 지원
                  text = desc_file.read_text(encoding="utf-8").strip()
                  if text:
                      blocks.append({"type": "text", "text": text})
                  for file in photo_files:
                      blocks.append({"type": "image", "file": file})

              else:
                  # 아무 글도 없으면 사진들만
                  for file in photo_files:
                      blocks.append({"type": "image", "file": file})

              result.append({
                  "slug": slug,
                  "key": base,
                  "title": title,
                  "date": group_date,
                  "cover": cover,
                  "photos": photo_files,
                  "blocks": blocks,
              })

          with open(IMAGES_DIR / "manifest.json", "w", encoding="utf-8") as f:
              json.dump({"groups": result}, f, ensure_ascii=False, indent=2)

          print(f"{len(result)}개 그룹, 사진 {len(files)}장으로 manifest.json 생성 완료")

          # ---- 그룹별 실제 페이지(group/<slug>/index.html) 생성 ----
          # 쿼리스트링(?g=) 없이 group/<slug>/ 주소로 바로 접속되게 하기 위해,
          # 템플릿 하나를 그룹 수만큼 실제 파일로 복사해둡니다.
          import shutil
          template = Path("templates/group-template.html")
          group_root = Path("group")
          group_root.mkdir(exist_ok=True)

          current_slugs = {g["slug"] for g in result}
          existing_dirs = {p.name for p in group_root.iterdir() if p.is_dir()}

          if template.exists():
              for slug in current_slugs:
                  dest_dir = group_root / slug
                  dest_dir.mkdir(exist_ok=True)
                  shutil.copyfile(template, dest_dir / "index.html")

          # 더 이상 존재하지 않는 그룹의 폴더는 정리
          for stale in existing_dirs - current_slugs:
              shutil.rmtree(group_root / stale)

          print(f"group/ 아래 {len(current_slugs)}개 그룹 폴더 생성/정리 완료")
          PY

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/manifest.json
          git add -A -- group
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "chore: update image manifest [skip ci]"
            git push
          fi
