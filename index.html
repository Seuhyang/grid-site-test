<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empower Design</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#131211;
    --paper:#faf9f6;
    --line:#e2ded4;
    --muted:#8a8478;
    --accent:#3b4b6b;
    --nav-h: 64px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  img{ display:block; max-width:100%; }
  a{ color:inherit; text-decoration:none; }

  /* ---------- 상단 메뉴바 ---------- */
  header.site-nav{
    position:sticky; top:0; z-index:100;
    height:var(--nav-h);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 28px;
    background:rgba(250,249,246,0.86);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex; align-items:baseline; gap:8px;
    line-height:1;
  }
  .brand .word-empower{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:22px;
    color:#e2431f;
    -webkit-text-stroke:1px #7a1f10;
    letter-spacing:0.01em;
  }
  .brand .word-design{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--ink);
  }
  @media (max-width:480px){
    .brand .word-empower{ font-size:18px; }
    .brand .word-design{ font-size:10px; }
  }
  nav.menu ul{ list-style:none; display:flex; gap:28px; margin:0; padding:0; }
  nav.menu a{
    font-size:13px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink); padding:6px 2px; position:relative;
  }
  nav.menu a::after{
    content:""; position:absolute; left:0; right:0; bottom:-2px; height:1px;
    background:var(--accent); transform:scaleX(0); transform-origin:right;
    transition:transform .25s ease;
  }
  nav.menu a:hover::after, nav.menu a.active::after{ transform:scaleX(1); transform-origin:left; }
  nav.menu a.active{ color:var(--accent); }
  @media (max-width:480px){
    header.site-nav{ padding:0 16px; }
    nav.menu ul{ gap:16px; }
    nav.menu a{ font-size:11.5px; }
  }

  /* ---------- 갤러리 (그룹 표지 그리드) ---------- */
  main.gallery{ width:100%; }
  .gallery-item{
    position:relative; display:block; width:100%;
    overflow:hidden; border-bottom:1px solid var(--line);
    cursor:pointer; background:var(--line);
  }
  .gallery-item img{
    display:block; width:100%; height:auto;
    opacity:1;
  }
  .gallery-item img.is-loading{
    opacity:0; transform:scale(1.02);
  }
  .gallery-item img.is-visible{
    opacity:1; transform:scale(1);
    transition:opacity .6s ease, transform .6s ease;
  }

  /* 데스크톱: 정렬된 그리드 */
  @media (min-width:900px){
    main.gallery{
      max-width:1400px; margin:0 auto;
      display:grid; grid-template-columns: repeat(3, 1fr);
      gap:2px; background:var(--line);
    }
    .gallery-item{ aspect-ratio: 4 / 5; border-bottom:none; }
    .gallery-item img{ width:100%; height:100%; object-fit:cover; }
  }
  @media (min-width:1400px){
    main.gallery{ grid-template-columns: repeat(4, 1fr); }
  }

  /* 마우스 오버 시 타이틀 표시 (호버가 가능한 기기에서만) */
  .gallery-item .tile-title{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background:rgba(19,18,17,0.45);
    color:#faf9f6;
    font-family:'Fraunces', serif; font-style:italic; font-weight:300;
    font-size:18px; letter-spacing:0.02em;
    opacity:0; transition:opacity .25s ease;
    pointer-events:none;
  }
  @media (hover:hover) and (pointer:fine){
    .gallery-item:hover .tile-title{ opacity:1; }
  }
</style>
</head>
<body>

<header class="site-nav">
  <a class="brand" href="./" aria-label="Empower Design 홈으로">
    <span class="word-empower">Empower</span>
    <span class="word-design">DESIGN</span>
  </a>
  <nav class="menu">
    <ul>
      <li><a href="./" class="active">홈</a></li>
      <li><a href="#">A</a></li>
      <li><a href="#">B</a></li>
      <li><a href="#">C</a></li>
      <li><a href="#">문의</a></li>
    </ul>
  </nav>
</header>

<main class="gallery" id="gallery">
  <!-- JS가 그룹(=사진 묶음) 표지를 자동으로 채워 넣습니다 -->
</main>

<script>
/*
  ================================================================
  이미지 자동 불러오기 + 자동 그룹핑 (GitHub Actions가 만든 manifest.json 사용)

  - 사진은 images 폴더에 넣기만 하면 됩니다. 같은 순간에 찍혀서 파일명이
    "이름.jpg", "이름_01.jpg", "이름_02.jpg" 처럼 이어지는 사진들은
    자동으로 한 그룹(=클릭하면 이동하는 한 페이지)으로 묶입니다.
  - 그룹의 날짜는 파일명이 아니라 그 사진이 저장소에 처음 커밋된 실제
    시각을 기준으로 하므로, 카카오톡 사진이 아니어도 정확히 동작합니다.
  - .github/workflows/generate-image-manifest.yml 참고
  ================================================================
*/
const IMAGES_FOLDER = "images";

async function fetchGroups(){
  const res = await fetch(`${IMAGES_FOLDER}/manifest.json`);
  if (!res.ok) throw new Error(`매니페스트를 불러오지 못했습니다 (status: ${res.status})`);
  const data = await res.json();
  return data.groups || [];
}

/*
  표시 순서 설정 (개발자가 직접 지정 - 방문자에게는 선택지가 노출되지 않음)
  SORT_MODE: 'newest' | 'oldest' | 'pinned-random'
  PINNED_SLUGS: pinned-random 모드에서 맨 앞에 고정할 그룹의 slug(=manifest의 slug 값)
*/
const SORT_MODE = 'newest';
const PINNED_SLUGS = [];

function shuffle(arr){
  const result = [...arr];
  for (let i = result.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function getOrderedGroups(groups){
  if (SORT_MODE === 'oldest'){
    return [...groups].sort((a,b) => new Date(a.date) - new Date(b.date));
  }
  if (SORT_MODE === 'newest'){
    return [...groups].sort((a,b) => new Date(b.date) - new Date(a.date));
  }
  if (SORT_MODE === 'pinned-random'){
    const pinned = PINNED_SLUGS.map(slug => groups.find(g => g.slug === slug)).filter(Boolean);
    const pinnedSlugs = new Set(pinned.map(g => g.slug));
    const rest = shuffle(groups.filter(g => !pinnedSlugs.has(g.slug)));
    return [...pinned, ...rest];
  }
  return groups;
}

const galleryEl = document.getElementById('gallery');

const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.remove('is-loading');
      revealObserver.unobserve(entry.target);
    }
  });
}, { rootMargin: '0px 0px -5% 0px', threshold: 0.05 });

function renderGallery(groups){
  galleryEl.innerHTML = '';
  groups.forEach(group => {
    const tile = document.createElement('a');
    tile.className = 'gallery-item';
    tile.href = `group/${encodeURIComponent(group.slug)}/`;

    // 이 그리드에서 나갈 때 스크롤 위치 저장 (뒤로가기 시 복원용)
    tile.addEventListener('click', () => {
      sessionStorage.setItem('mainScrollY', String(window.scrollY));
    });

    const img = document.createElement('img');
    img.src = `${IMAGES_FOLDER}/${group.cover}`;
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = group.title;

    const titleEl = document.createElement('span');
    titleEl.className = 'tile-title';
    titleEl.textContent = group.title;

    tile.appendChild(img);
    tile.appendChild(titleEl);
    galleryEl.appendChild(tile);
  });

  document.querySelectorAll('.gallery-item img').forEach(img => {
    // 페이드인은 순전히 연출용입니다. 어떤 이유로든(느린 네트워크,
    // 인앱브라우저의 이벤트 처리 차이 등) 아래 관찰자가 동작하지 않아도
    // 이미지는 기본 상태(opacity:1)로 항상 보입니다.
    img.classList.add('is-loading');
    revealObserver.observe(img);
    // 안전장치: 관찰자가 어떤 이유로든 못 걸리는 경우를 대비해
    // 일정 시간 후에는 무조건 보이는 상태로 되돌립니다.
    setTimeout(() => img.classList.remove('is-loading'), 1200);
  });
}

function restoreScrollIfNeeded(){
  const saved = sessionStorage.getItem('mainScrollY');
  if (saved === null) return;
  sessionStorage.removeItem('mainScrollY');
  // 그리드 레이아웃이 자리 잡을 시간을 살짝 준 뒤 복원
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      window.scrollTo(0, parseInt(saved, 10) || 0);
    });
  });
}

if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}

(async function init(){
  try {
    const groups = await fetchGroups();
    renderGallery(getOrderedGroups(groups));
    restoreScrollIfNeeded();
  } catch (err) {
    console.error(err);
    galleryEl.innerHTML = `
      <p style="padding:40px 20px; font-size:14px; color:var(--muted);">
        사진을 불러오지 못했습니다. images/manifest.json 파일이 저장소에
        있는지 확인해주세요. 방금 사진을 처음 올리셨다면 GitHub Actions가
        manifest.json을 만들 때까지 잠깐(보통 몇십 초) 기다려야 할 수 있어요.
      </p>`;
  }
})();
</script>

</body>
</html>
